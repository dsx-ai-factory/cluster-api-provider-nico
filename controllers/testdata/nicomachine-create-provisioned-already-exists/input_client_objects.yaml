apiVersion: v1
kind: Secret
metadata:
  name: nico-creds
  namespace: default
type: Opaque
stringData:
  endpoint: https://nico.example
  orgID: org-1
  token: test-token
---
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-1
  namespace: default
type: Opaque
stringData:
  value: |
    #cloud-config
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-1-kubeconfig
  namespace: default
type: Opaque
stringData:
  value: test-kubeconfig
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: cluster-1
  namespace: default
spec:
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: NicoCluster
    name: nico-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoCluster
metadata:
  name: nico-1
  namespace: default
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta2
    kind: Cluster
    name: cluster-1
    uid: 00000000-0000-0000-0000-000000000000
spec:
  siteID: site-1
  identityRef:
    name: nico-creds
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Machine
metadata:
  name: machine-1
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: cluster-1
spec:
  clusterName: cluster-1
  bootstrap:
    dataSecretName: bootstrap-1
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: NicoMachine
    name: nicomachine-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachine
metadata:
  name: nicomachine-1
  namespace: default
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta2
    kind: Machine
    name: machine-1
    uid: 00000000-0000-0000-0000-000000000000
  labels:
    cluster.x-k8s.io/cluster-name: cluster-1
spec:
  vpcID: vpc-1
  machineID: machine-id-1
  interfaces:
  - subnetID: subnet-1
