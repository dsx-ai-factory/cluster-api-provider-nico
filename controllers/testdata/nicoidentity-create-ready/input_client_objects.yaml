apiVersion: v1
kind: Secret
metadata:
  name: nico-creds
  namespace: default
type: Opaque
stringData:
  endpoint: https://nico.example
  orgID: org-1
  token: test-token
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoIdentity
metadata:
  name: nico-identity
  namespace: default
spec:
  credentialsRef:
    name: nico-creds
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoIdentity
metadata:
  name: other-identity
  namespace: default
spec:
  credentialsRef:
    name: nico-creds
