apiVersion: v1
kind: Namespace
metadata:
  name: test-ns
---
apiVersion: v1
kind: Secret
metadata:
  name: nico-creds
  namespace: test-ns
type: Opaque
stringData:
  endpoint: https://nico.example
  orgID: org-1
  token: test-token
---
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-1
  namespace: test-ns
type: Opaque
stringData:
  value: |
    #cloud-config
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: cluster-1
  namespace: test-ns
spec:
  paused: true
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: NicoCluster
    name: nico-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoCluster
metadata:
  name: nico-1
  namespace: test-ns
spec:
  siteID: site-1
  identityRef:
    name: nico-creds
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Machine
metadata:
  name: machine-1
  namespace: test-ns
  labels:
    cluster.x-k8s.io/cluster-name: cluster-1
spec:
  clusterName: cluster-1
  bootstrap:
    dataSecretName: bootstrap-1
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: NicoMachine
    name: nicomachine-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachine
metadata:
  name: nicomachine-1
  namespace: test-ns
  labels:
    cluster.x-k8s.io/cluster-name: cluster-1
spec:
  vpcID: vpc-1
  machineID: machine-id-1
  interfaces:
  - subnetID: subnet-1
