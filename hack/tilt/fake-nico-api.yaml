#
# The fake NICo API and its local credentials. Applied by the Tiltfile for
# local development; not part of the released provider components.
#
apiVersion: v1
kind: Namespace
metadata:
  name: fake-nico-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-nico-api
  namespace: fake-nico-api
  labels:
    app.kubernetes.io/name: fake-nico-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-nico-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-nico-api
    spec:
      containers:
      - name: api
        image: fake-nico-api-server
        imagePullPolicy: IfNotPresent
        args:
        - --addr=:8090
        - --seed=/etc/fake-nico/seed.yaml
        env:
        - name: FAKE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nico-credentials
              key: clientID
        - name: FAKE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nico-credentials
              key: clientSecret
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: seed
          mountPath: /etc/fake-nico
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: seed
        configMap:
          name: fake-nico-seed
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
# Inventory the fake serves. The machine labels are what CAPNICo reads to
# publish NicoCluster.status.failureDomains and what it matches a placement
# selector against, so both racks below are requestable domains.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-nico-seed
  namespace: fake-nico-api
data:
  seed.yaml: |
    machines:
    - org: org-1
      resource:
        id: machine-rack-a-1
        siteId: site-1
        instanceTypeId: type-1
        labels:
          failure_domain: rack-group-a
    - org: org-1
      resource:
        id: machine-rack-a-2
        siteId: site-1
        instanceTypeId: type-1
        labels:
          failure_domain: rack-group-a
    - org: org-1
      resource:
        id: machine-rack-b-1
        siteId: site-1
        instanceTypeId: type-1
        labels:
          failure_domain: rack-group-b
---
apiVersion: v1
kind: Service
metadata:
  name: fake-nico-api
  namespace: fake-nico-api
  labels:
    app.kubernetes.io/name: fake-nico-api
spec:
  selector:
    app.kubernetes.io/name: fake-nico-api
  ports:
  - name: http
    port: 8090
    protocol: TCP
    targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: nico-credentials
  namespace: fake-nico-api
type: Opaque
stringData:
  clientID: fake-client
  clientSecret: fake-secret
