global
  log stdout format raw local0

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 1m
  timeout server 1m

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s

frontend api
  bind *:6443
  default_backend controlplane

backend controlplane
  server node capnico-e2e-control-plane:6443 check resolvers docker init-addr none
