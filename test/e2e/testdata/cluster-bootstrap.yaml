---
apiVersion: v1
kind: Namespace
metadata:
  name: capnico-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: nico-credentials
  namespace: capnico-system
type: Opaque
stringData:
  endpoint: http://fake-nico-api.fake-nico-api.svc.cluster.local:8090
  orgID: org-1
  tokenURL: http://fake-nico-api.fake-nico-api.svc.cluster.local:8090/token
  clientID: fake-client
  clientSecret: fake-secret
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoCluster
metadata:
  name: capnico-e2e
  namespace: capnico-e2e
spec:
  siteID: site-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachineTemplate
metadata:
  name: capnico-e2e-control-plane
  namespace: capnico-e2e
spec:
  template:
    spec:
      vpcID: vpc-1
      instanceTypeID: type-1
      cloudInitInjectHostname: true
      interfaces:
      - vpcPrefixID: prefix-1
      # Selects the dedicated control-plane IP behavior in the Docker backend.
      labels:
        capnico-fake/control-plane: "true"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachineTemplate
metadata:
  name: capnico-e2e-workers
  namespace: capnico-e2e
spec:
  template:
    spec:
      vpcID: vpc-1
      instanceTypeID: type-1
      cloudInitInjectHostname: true
      interfaces:
      - vpcPrefixID: prefix-1
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: capnico-e2e
  namespace: capnico-e2e
  labels:
    cni: kindnet
spec:
  controlPlaneEndpoint:
    host: ${CONTROL_PLANE_HOSTNAME}
    port: 6443
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.128.0.0/12
    serviceDomain: cluster.local
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: capnico-e2e-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: NicoCluster
    name: capnico-e2e
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: capnico-e2e-control-plane
  namespace: capnico-e2e
spec:
  replicas: 1
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: NicoMachineTemplate
        name: capnico-e2e-control-plane
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs:
          - ${CONTROL_PLANE_HOSTNAME}
    initConfiguration:
      # The container cannot load the host's configs kernel module.
      nodeRegistration:
        ignorePreflightErrors:
          - SystemVerification
    joinConfiguration:
      nodeRegistration:
        ignorePreflightErrors:
          - SystemVerification
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: capnico-e2e-workers
  namespace: capnico-e2e
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          ignorePreflightErrors:
            - SystemVerification
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: capnico-e2e-workers
  namespace: capnico-e2e
spec:
  clusterName: capnico-e2e
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: capnico-e2e
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: capnico-e2e-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: NicoMachineTemplate
        name: capnico-e2e-workers
---
# Installs vendored kindnet from a ConfigMap created by bootstrap_test.go.
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: capnico-e2e-kindnet
  namespace: capnico-e2e
spec:
  clusterSelector:
    matchLabels:
      cni: kindnet
  resources:
    - name: cni-kindnet
      kind: ConfigMap
  strategy: ApplyOnce
