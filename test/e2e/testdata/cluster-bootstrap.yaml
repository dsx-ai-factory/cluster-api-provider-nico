#
# A real KubeadmControlPlane + MachineDeployment/KubeadmConfigTemplate cluster,
# backed by the docker-backed fake NICo API (see fake-nico-api-docker.yaml), to
# prove CAPNico's controllers work with the kubeadm bootstrap and control-plane
# providers end to end -- not just that CAPNico calls the NICo API correctly.
#
# Two differences from examples/kubeadm/cluster-kube-vip.yaml, both because
# this runs against fake containers rather than real NICo hardware:
#
#  1. kube-vip runs in ARP mode, not BGP. BGP needs a real peer router; ARP
#     mode just announces the floating IP on the local network segment, which
#     a plain Docker bridge network (`kind`) supports.
#
#  2. The provider ID comes from a NICO_INSTANCE_ID environment variable the
#     docker backend sets on the container (internal/fake/docker/backend.go),
#     not from curling the metadata service at 169.254.169.254:7777. On real
#     NICo hardware that service is served by the DPU agent (see
#     docs/getting-started.md); fake containers have nothing to serve it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: capnico-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: nico-credentials
  namespace: capnico-system
type: Opaque
stringData:
  endpoint: http://fake-nico-api.fake-nico-api.svc.cluster.local:8090
  orgID: org-1
  tokenURL: http://fake-nico-api.fake-nico-api.svc.cluster.local:8090/token
  clientID: fake-client
  clientSecret: fake-secret
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoCluster
metadata:
  name: capnico-e2e
  namespace: capnico-e2e
spec:
  siteID: site-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachineTemplate
metadata:
  name: capnico-e2e-control-plane
  namespace: capnico-e2e
spec:
  template:
    spec:
      vpcID: vpc-1
      instanceTypeID: type-1
      interfaces:
      - vpcPrefixID: prefix-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachineTemplate
metadata:
  name: capnico-e2e-workers
  namespace: capnico-e2e
spec:
  template:
    spec:
      vpcID: vpc-1
      instanceTypeID: type-1
      interfaces:
      - vpcPrefixID: prefix-1
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: capnico-e2e
  namespace: capnico-e2e
spec:
  controlPlaneEndpoint:
    host: 172.18.255.250
    port: 6443
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.128.0.0/12
    serviceDomain: cluster.local
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: capnico-e2e-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: NicoCluster
    name: capnico-e2e
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: capnico-e2e-control-plane
  namespace: capnico-e2e
spec:
  replicas: 1
  version: v1.31.0
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: NicoMachineTemplate
        name: capnico-e2e-control-plane
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs:
          - 172.18.255.250
    initConfiguration:
      patches:
        directory: /etc/kubernetes/patches
    joinConfiguration:
      patches:
        directory: /etc/kubernetes/patches
    files:
      - path: /usr/local/bin/configure-kube-vip.sh
        owner: root:root
        permissions: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /etc/kubernetes/manifests
          cat > /etc/kubernetes/manifests/kube-vip.yaml <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
            annotations:
              scheduler.alpha.kubernetes.io/critical-pod: ""
            labels:
              component: kube-vip
              tier: control-plane
          spec:
            containers:
              - name: kube-vip
                image: ghcr.io/kube-vip/kube-vip:v0.8.9
                imagePullPolicy: IfNotPresent
                args:
                  - manager
                env:
                  - name: address
                    value: "172.18.255.250"
                  - name: cp_enable
                    value: "true"
                  - name: cp_namespace
                    value: kube-system
                  - name: vip_arp
                    value: "true"
                  - name: vip_interface
                    value: eth0
                  - name: vip_cidr
                    value: "32"
                  - name: port
                    value: "6443"
                  - name: svc_enable
                    value: "false"
                  - name: dns_mode
                    value: first
                  - name: vip_nodename
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                securityContext:
                  capabilities:
                    add:
                      - NET_ADMIN
                      - NET_RAW
                volumeMounts:
                  - mountPath: /etc/kubernetes/admin.conf
                    name: kubeconfig
            hostAliases:
              - hostnames:
                  - kubernetes
                ip: 127.0.0.1
            hostNetwork: true
            volumes:
              - hostPath:
                  path: /etc/kubernetes/admin.conf
                name: kubeconfig
          EOF
    preKubeadmCommands:
      - /usr/local/bin/configure-kube-vip.sh
      - |
        mkdir -p /etc/kubernetes/patches
        printf "apiVersion: kubelet.config.k8s.io/v1beta1\nkind: KubeletConfiguration\nproviderID: nico://%s\n" "$NICO_INSTANCE_ID" > /etc/kubernetes/patches/kubeletconfiguration0-provider-id.yaml
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: capnico-e2e-workers
  namespace: capnico-e2e
spec:
  template:
    spec:
      joinConfiguration:
        patches:
          directory: /etc/kubernetes/patches
      preKubeadmCommands:
        - |
          mkdir -p /etc/kubernetes/patches
          printf "apiVersion: kubelet.config.k8s.io/v1beta1\nkind: KubeletConfiguration\nproviderID: nico://%s\n" "$NICO_INSTANCE_ID" > /etc/kubernetes/patches/kubeletconfiguration0-provider-id.yaml
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: capnico-e2e-workers
  namespace: capnico-e2e
spec:
  clusterName: capnico-e2e
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: capnico-e2e
      version: v1.31.0
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: capnico-e2e-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: NicoMachineTemplate
        name: capnico-e2e-workers
