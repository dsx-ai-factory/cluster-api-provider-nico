#
# The docker-backed fake NICo API for the bootstrap e2e test. Unlike
# hack/tilt/fake-nico-api.yaml (in-memory, local dev default), this runs
# instances as real kindest/node containers, so it needs the host's Docker
# socket (see test/e2e/testdata/kind-config.yaml) and runs as root to reach
# it.
apiVersion: v1
kind: Namespace
metadata:
  name: fake-nico-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-nico-api
  namespace: fake-nico-api
  labels:
    app.kubernetes.io/name: fake-nico-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-nico-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-nico-api
    spec:
      containers:
      - name: api
        image: fake-nico-api-server
        imagePullPolicy: IfNotPresent
        args:
        - --addr=:8090
        - --backend=docker
        env:
        - name: FAKE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nico-credentials
              key: clientID
        - name: FAKE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nico-credentials
              key: clientSecret
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      # The docker socket is root-owned on the kind node; the fake's image
      # otherwise defaults to a non-root user (see Dockerfile.fake).
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
---
apiVersion: v1
kind: Service
metadata:
  name: fake-nico-api
  namespace: fake-nico-api
  labels:
    app.kubernetes.io/name: fake-nico-api
spec:
  selector:
    app.kubernetes.io/name: fake-nico-api
  ports:
  - name: http
    port: 8090
    protocol: TCP
    targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: nico-credentials
  namespace: fake-nico-api
type: Opaque
stringData:
  clientID: fake-client
  clientSecret: fake-secret
