# Exposes the host's Docker socket inside the kind node so a pod (the docker
# fake NICo backend) can bind-mount it in turn and run sibling containers on
# the host's daemon.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
