# A token endpoint that accepts every request and never answers. Pointing a
# credentials Secret's tokenURL here holds an Identity check open until the
# validation deadline, which the installation suite uses to supersede a check
# and to observe a timed-out result.
apiVersion: v1
kind: Namespace
metadata:
  name: capnico-e2e-hang
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hang-cgi
  namespace: capnico-e2e-hang
data:
  token: |
    #!/bin/sh
    sleep 600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hang
  namespace: capnico-e2e-hang
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hang
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hang
    spec:
      containers:
      - name: httpd
        image: busybox:1.37.0
        command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
        volumeMounts:
        - name: cgi
          mountPath: /www/cgi-bin
      volumes:
      - name: cgi
        configMap:
          name: hang-cgi
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: hang
  namespace: capnico-e2e-hang
spec:
  selector:
    app.kubernetes.io/name: hang
  ports:
  - name: http
    port: 8080
    targetPort: http
