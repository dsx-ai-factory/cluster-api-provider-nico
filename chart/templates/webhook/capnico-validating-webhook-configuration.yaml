{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ include "cluster-api-provider-nico.namespaceName" . }}/serving-cert
    {{- end }}
  name: capnico-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: {{ include "cluster-api-provider-nico.namespaceName" . }}
      path: /validate-infrastructure-cluster-x-k8s-io-v1alpha1-nicomachinetemplate
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: validation.nicomachinetemplate.infrastructure.cluster.x-k8s.io
  rules:
  - apiGroups:
    - infrastructure.cluster.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nicomachinetemplates
  sideEffects: None
{{- end }}
