{{- /* Not a plain dereference: `helm upgrade --reuse-values` renders these
     templates against the previous release's values, which predate the
     namespace map. Absent map or key means create; explicit false is
     preserved. (dig takes a plain map, so it cannot be given .Values.) */ -}}
{{- if dig "create" true (.Values.namespace | default dict) }}
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cluster-api-provider-nico.name" . }}
  name: {{ .Release.Namespace }}
{{- end }}
