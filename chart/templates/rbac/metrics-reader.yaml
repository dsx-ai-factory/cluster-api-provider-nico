apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ include "cluster-api-provider-nico.namespaceName" . }}
{{- end }}
  name: metrics-reader
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
