apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cluster-api-provider-nico.resourceName" (dict "suffix" "leader-election-rolebinding" "context" $) }}
  namespace: {{ include "cluster-api-provider-nico.namespaceName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "cluster-api-provider-nico.serviceAccountName" . }}
  namespace: {{ include "cluster-api-provider-nico.namespaceName" . }}
