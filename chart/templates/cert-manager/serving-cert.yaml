{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: {{ include "cluster-api-provider-nico.namespaceName" . }}
spec:
  dnsNames:
  - webhook-service.{{ include "cluster-api-provider-nico.namespaceName" . }}.svc
  - webhook-service.{{ include "cluster-api-provider-nico.namespaceName" . }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
{{- end }}
