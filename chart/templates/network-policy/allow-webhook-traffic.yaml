{{- if and .Values.networkPolicy.enabled .Values.webhook.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cluster-api-provider-nico.name" . }}
  name: {{ include "cluster-api-provider-nico.resourceName" (dict "suffix" "allow-webhook-traffic" "context" $) }}
  namespace: {{ include "cluster-api-provider-nico.namespaceName" . }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: {{ include "cluster-api-provider-nico.name" . }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
{{- end }}
