default:
  tags:
    - nvpark-ngc-nke-prod

include:
  - project: nke/gitlab-ci-cd
    ref: main
    file:
      - /templates/defaults.gitlab-ci.yml
      - /templates/pipeline/versioning.gitlab-ci.yml
      - /templates/publish/common.gitlab-ci.yml
      - /templates/publish/multi-arch.gitlab-ci.yml

stages:
  - versioning
  - test
  - build
  - publish

variables:
  DSX_NGC_REGISTRY_IMAGE: nvcr.io/0837451325059433/components-dev/cluster-api-provider-nico
  KUSTOMIZE_VERSION: v5.8.1
  DSX_NGC_ORG: "0837451325059433"
  DSX_NGC_TEAM: "components-dev"
  PROVIDER_ARTIFACT_PACKAGE_NAME: cluster-api-provider-nico

.golang:
  rules:
    - changes:
        - .gitlab-ci.yml
        - Dockerfile
        - Makefile
        - api/**/*
        - cmd/**/*
        - config/**/*
        - controllers/**/*
        - internal/**/*
        - go.mod
        - go.sum

test:
  stage: test
  image: golang:1.25
  variables:
    KUBERNETES_CPU_LIMIT: "2000m"
    KUBERNETES_MEMORY_LIMIT: "6Gi"
  script:
    - |
      set -euo pipefail
      make test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

container-image:
  stage: build
  extends:
    - .build-image-multi-arch-kaniko
  variables:
    KUBERNETES_CPU_LIMIT: "2000m"
    KUBERNETES_MEMORY_LIMIT: "8Gi"

release-manifests:
  stage: build
  image: golang:1.25
  variables:
    KUBERNETES_CPU_LIMIT: "2000m"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  needs:
    - job: gen-version
  before_script:
    - |
      set -euo pipefail
      apt-get update -qq > /dev/null
      DEBIAN_FRONTEND=noninteractive apt-get install -qq -y curl > /dev/null
      curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL \
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
        -o /tmp/kustomize.tar.gz
      tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
  script:
    - |
      set -euo pipefail
      CONTROLLER_IMG="${CI_REGISTRY_IMAGE}:${BUILD_VERSION}" \
      KUSTOMIZE=kustomize \
      make release-manifests
  artifacts:
    paths:
      - out/metadata.yaml
      - out/infrastructure-components.yaml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

publish-image-nvcr:
  stage: publish
  extends:
    - .publish-multi-arch-manifest-nvcr

publish-image-gitlab:
  stage: publish
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  needs:
    - job: gen-version
    - job: container-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  before_script:
    - |
      set -euo pipefail
      crane auth login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - |
      set -euo pipefail
      echo "Publishing ${BUILD_VERSION} multi-arch manifest to ${CI_REGISTRY_IMAGE}"

      crane index append \
        --manifest "${CI_REGISTRY_IMAGE}:${BUILD_VERSION}-amd64" \
        --manifest "${CI_REGISTRY_IMAGE}:${BUILD_VERSION}-arm64" \
        --tag "${CI_REGISTRY_IMAGE}:${BUILD_VERSION}"

      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        crane tag "${CI_REGISTRY_IMAGE}:${BUILD_VERSION}" latest
      fi

publish-image-dsx-nvcr:
  stage: publish
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  extends:
    - .multi-arch-rules
  needs:
    - job: gen-version
    - job: container-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  before_script:
    - |
      set -euo pipefail
      if [ -z "${NGC_REGISTRY_TOKEN_DSX:-}" ]; then
        echo "NGC_REGISTRY_TOKEN_DSX is required to publish images to the DSX NGC repo"
        exit 1
      fi
      crane auth login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
      crane auth login -u '$oauthtoken' -p "${NGC_REGISTRY_TOKEN_DSX}" nvcr.io
  script:
    - |
      set -euo pipefail
      echo "Publishing ${BUILD_VERSION} to ${DSX_NGC_REGISTRY_IMAGE}"

      for ARCH in amd64 arm64; do
        crane copy "${CI_REGISTRY_IMAGE}:${BUILD_VERSION}-${ARCH}" "${DSX_NGC_REGISTRY_IMAGE}:${BUILD_VERSION}-${ARCH}"
      done

      crane index append \
        --manifest "${DSX_NGC_REGISTRY_IMAGE}:${BUILD_VERSION}-amd64" \
        --manifest "${DSX_NGC_REGISTRY_IMAGE}:${BUILD_VERSION}-arm64" \
        --tag "${DSX_NGC_REGISTRY_IMAGE}:${BUILD_VERSION}"

      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        crane tag "${DSX_NGC_REGISTRY_IMAGE}:${BUILD_VERSION}" latest
      fi

publish-provider-artifacts-gitlab:
  stage: publish
  image: alpine:3.20
  needs:
    - job: gen-version
    - job: release-manifests
      artifacts: true
    - job: publish-image-gitlab
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -euo pipefail
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PROVIDER_ARTIFACT_PACKAGE_NAME}/${BUILD_VERSION}"

      for artifact_path in out/metadata.yaml out/infrastructure-components.yaml; do
        artifact="$(basename "${artifact_path}")"
        echo "Publishing ${artifact} to ${package_url}/${artifact}"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${artifact_path}" \
          "${package_url}/${artifact}"
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

publish-dsx-helm-chart:
  stage: publish
  image: ubuntu:${UBUNTU_VERSION}
  needs:
    - job: gen-version
    - job: release-manifests
      artifacts: true
    - job: publish-image-dsx-nvcr
  before_script:
    - apt-get update -qq > /dev/null
    - DEBIAN_FRONTEND=noninteractive apt-get install -qq -y curl gpg apt-transport-https python3-yaml unzip > /dev/null
    - curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | tee /usr/share/keyrings/helm.gpg > /dev/null
    - echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | tee /etc/apt/sources.list.d/helm-stable-debian.list > /dev/null
    - apt-get update -qq > /dev/null
    - DEBIAN_FRONTEND=noninteractive apt-get install -qq -y helm > /dev/null
    - curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://ngc.nvidia.com/downloads/ngccli_linux.zip -o ngccli_linux.zip
    - unzip -q -o ngccli_linux.zip
    - chmod +x ngc-cli/ngc
    - export PATH="${PWD}/ngc-cli:${PATH}"
  script:
    - |
      set -euo pipefail

      if [ -z "${NGC_REGISTRY_TOKEN_DSX:-}" ]; then
        echo "NGC_REGISTRY_TOKEN_DSX is required to publish charts to the DSX NGC repo"
        exit 1
      fi

      chart_dir="charts/capi-provider-nico"
      chart_name="$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["name"])' "$chart_dir/Chart.yaml")"
      chart_version="${BUILD_VERSION#v}"
      chart_dist="dist/${chart_name}"

      mkdir -p "$chart_dir/files"
      cp out/infrastructure-components.yaml "$chart_dir/files/infrastructure-components.yaml"
      python3 - "$chart_dir/files/infrastructure-components.yaml" "${CI_REGISTRY_IMAGE}:${BUILD_VERSION}" "${DSX_NGC_REGISTRY_IMAGE}:${BUILD_VERSION}" <<'PY'
      import sys

      manifest_path, source_image, target_image = sys.argv[1:]
      with open(manifest_path) as manifest_file:
          manifest = manifest_file.read()

      if source_image in manifest:
          manifest = manifest.replace(source_image, target_image)
      elif target_image not in manifest:
          raise SystemExit(f"expected image {source_image} or {target_image} not found in {manifest_path}")

      with open(manifest_path, "w") as manifest_file:
          manifest_file.write(manifest)
      PY

      rm -rf "$chart_dist"
      mkdir -p "$chart_dist"

      helm package "$chart_dir" \
        --version "$chart_version" \
        --app-version "$BUILD_VERSION" \
        --destination "$chart_dist"
      package_file="${chart_dist}/${chart_name}-${chart_version}.tgz"

      if [ ! -f "$package_file" ]; then
        echo "Failed to locate packaged chart for ${chart_name}"
        exit 1
      fi

      export NGC_CLI_API_KEY="${NGC_REGISTRY_TOKEN_DSX}"
      export NGC_CLI_ORG="${DSX_NGC_ORG}"
      export NGC_CLI_TEAM="${DSX_NGC_TEAM}"

      chart_target="${DSX_NGC_ORG}/${DSX_NGC_TEAM}/${chart_name}"
      chart_version_target="${chart_target}:${chart_version}"

      if ! ngc registry chart info "$chart_target" > /dev/null 2>&1; then
        echo "Creating NGC chart metadata for ${chart_target}"
        set +e
        create_output="$(ngc registry chart create "$chart_target" --short-desc "Helm chart for ${chart_name}" 2>&1)"
        create_exit=$?
        set -e

        if [ "$create_exit" -ne 0 ]; then
          if printf '%s\n' "$create_output" | grep -qi "already exists"; then
            echo "NGC chart metadata for ${chart_target} already exists"
          else
            echo "$create_output"
            exit "$create_exit"
          fi
        else
          echo "$create_output"
        fi
      fi

      echo "Publishing ${package_file} to ${chart_version_target}"
      set +e
      push_output="$(ngc registry chart push "$chart_version_target" --source "$chart_dist" 2>&1)"
      push_exit=$?
      set -e

      if [ "$push_exit" -ne 0 ]; then
        if printf '%s\n' "$push_output" | grep -qi "already exists"; then
          echo "${chart_version_target} already exists in the DSX NGC chart repo; skipping"
        else
          echo "Helm push failed for ${package_file}"
          echo "$push_output"
          exit "$push_exit"
        fi
      else
        echo "$push_output"
        echo "Published ${package_file} to the DSX NGC chart repo"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
