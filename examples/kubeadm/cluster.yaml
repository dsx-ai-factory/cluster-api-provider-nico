# This example assumes a provider-level NICo credentials Secret has already been
# created in the controller-manager namespace (capnico-system by default).
# See the "Install" section of README.md for the Secret manifest.
#
# To override the provider-level credentials for a single cluster, set
# spec.identityRef on the NicoCluster below to the name of a Secret in this
# NicoCluster's own namespace.
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoCluster
metadata:
  name: demo
  namespace: default
spec:
  siteId: your-site
  vpcId: your-vpc
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachineTemplate
metadata:
  name: demo-control-plane
  namespace: default
spec:
  template:
    spec:
      instanceTypeId: your-instance-type
      cloudInitInjectHostname: true
      ipxeScript: |
        chain https://boot.example.com/ipxe/control-plane.ipxe
      sshKeyGroupIds:
        - your-ssh-key-group
      interfaces:
        - subnetId: your-subnet
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: NicoMachineTemplate
metadata:
  name: demo-workers
  namespace: default
spec:
  template:
    spec:
      instanceTypeId: your-instance-type
      cloudInitInjectHostname: true
      ipxeScript: |
        chain https://boot.example.com/ipxe/worker.ipxe
      sshKeyGroupIds:
        - your-ssh-key-group
      interfaces:
        - subnetId: your-subnet
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: demo
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.128.0.0/12
    serviceDomain: cluster.local
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: demo-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: NicoCluster
    name: demo
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: demo-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.30.4
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: NicoMachineTemplate
      name: demo-control-plane
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs:
          - 192.0.2.10
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: demo-workers
  namespace: default
spec:
  template:
    spec: {}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: demo-workers
  namespace: default
spec:
  clusterName: demo
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: demo
      version: v1.30.4
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: demo-workers
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: NicoMachineTemplate
        name: demo-workers
