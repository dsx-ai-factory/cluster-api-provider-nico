apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: capnico-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-api-provider-nico
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: cluster-api-provider-nico
    spec:
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      # Required by Pod Security Admission at the `restricted` level, which CAPI
      # management clusters commonly enforce. Without these the ReplicaSet is
      # rejected and no pod is ever created -- the Deployment sits at 0/1 and
      # carries no error of its own, so the failure is quiet.
      #
      # The image is already non-root (distroless nonroot, USER 65532:65532);
      # this only declares it so the admission controller can see it.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
