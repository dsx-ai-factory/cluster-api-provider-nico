kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nicoidentities.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: NicoIdentity
    listKind: NicoIdentityList
    plural: nicoidentities
    singular: nicoidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Result of the last completed credential validation
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: Completion time of the reported validation attempt
      jsonPath: .status.lastCheckedTime
      name: LastChecked
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NicoIdentity is an observation of NICo credentials, not a provisioning dependency.
          Status stays absent until the controller completes a check; absent status is not a successful check.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NicoIdentitySpec defines the credentials to observe without
              changing provisioning.
            properties:
              credentialsRef:
                description: CredentialsRef names the Secret in this Identity's namespace.
                  The reference is mutable.
                properties:
                  name:
                    description: Name is the name of the Secret containing NICo connection
                      and authentication settings.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
