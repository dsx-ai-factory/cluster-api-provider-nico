---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nicomachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: NicoMachine
    listKind: NicoMachineList
    plural: nicomachines
    shortNames:
    - nicom
    singular: nicomachine
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NicoMachine is the Schema for the nicomachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NicoMachineSpec defines the desired state of NicoMachine.
            properties:
              allowUnhealthyMachine:
                description: AllowUnhealthyMachine allows targeted instance creation
                  on a machine in Error status.
                type: boolean
              cloudInitInjectHostname:
                description: CloudInitInjectHostname prepends hostname directives
                  to the bootstrap cloud-config.
                type: boolean
              infinibandInterfaces:
                description: |-
                  InfinibandInterfaces requests that one or more InfiniBand Partitions be attached
                  to the instance.
                items:
                  description: NicoMachineInfiniBandInterface defines one NICo InfiniBand
                    interface attachment request.
                  properties:
                    device:
                      description: Device is the name of the InfiniBand device to
                        use.
                      type: string
                    deviceInstance:
                      description: DeviceInstance is the index of the device, used
                        to identify which interface card to attach the Partition to.
                      format: int32
                      type: integer
                    isPhysical:
                      description: IsPhysical specifies whether this Partition should
                        be attached to the Instance over physical interface.
                      type: boolean
                    partitionId:
                      description: PartitionID is the ID of the Partition the Interface
                        should attach to.
                      minLength: 1
                      type: string
                    vendor:
                      description: Vendor is the name of the InfiniBand device vendor,
                        optional.
                      type: string
                    virtualFunctionId:
                      description: VirtualFunctionID must be specified if isPhysical
                        is false.
                      format: int32
                      type: integer
                  required:
                  - partitionId
                  type: object
                type: array
              instanceTypeId:
                description: |-
                  InstanceTypeID is the instance type ID to provision.
                  Exactly one of InstanceTypeID or MachineID must be set.
                minLength: 1
                type: string
              interfaces:
                description: |-
                  Interfaces are the interface attachment requests for the instance.
                  Use subnet-based attachments for Ethernet network virtualization and VPC prefix-based attachments for next-generation networking.
                items:
                  description: NicoMachineInterface defines one NICo interface attachment
                    request.
                  properties:
                    device:
                      description: Device is the device name to use for this attachment.
                      type: string
                    deviceInstance:
                      description: DeviceInstance is the device instance index to
                        use for this attachment.
                      format: int32
                      type: integer
                    ipAddress:
                      description: |-
                        IPAddress is the explicitly requested IP address for this interface.
                        This is only supported for VPCPrefixID-based interfaces. NICo requires the least-significant host bit to be 1.
                      type: string
                    physical:
                      description: Physical requests this attachment over a physical
                        interface.
                      type: boolean
                    subnetId:
                      description: |-
                        SubnetID is the subnet ID for this attachment.
                        Use SubnetID for Ethernet network virtualization.
                        Exactly one of SubnetID or VPCPrefixID must be set.
                      type: string
                    vpcPrefixId:
                      description: |-
                        VPCPrefixID is the VPC prefix ID for this attachment.
                        Use VPCPrefixID for next-generation networking.
                        Exactly one of SubnetID or VPCPrefixID must be set.
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: ipAddress is only supported with vpcPrefixId interfaces
                    rule: '!(has(self.ipAddress) && has(self.subnetId))'
                minItems: 1
                type: array
              ipxeScript:
                description: IpxeScript is the iPXE script used to boot this instance.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels are applied to the instance.
                type: object
              machineId:
                description: |-
                  MachineID is the machine ID for targeted instance creation.
                  Exactly one of InstanceTypeID or MachineID must be set.
                minLength: 1
                type: string
              nvLinkInterfaces:
                description: |-
                  NVLinkInterfaces requests that one or more NVLink Logical Partitions be attached
                  to the instance.
                items:
                  description: NicoMachineNVLinkInterface defines one NICo NVLink
                    interface attachment request.
                  properties:
                    deviceInstance:
                      description: DeviceInstance is the GPU index for this NVLink
                        interface. Must be non-negative, unique within the request,
                        and within the GPU count exposed by the selected Machine or
                        Instance Type.
                      format: int32
                      type: integer
                    nvLinkLogicalPartitionId:
                      description: NVLinkLogicalPartitionID is the ID of the NVLink
                        Logical Partition the Interface should attach to.
                      minLength: 1
                      type: string
                  required:
                  - nvLinkLogicalPartitionId
                  type: object
                type: array
              providerID:
                description: ProviderID is set to `nico://<instance-id>` after the
                  NICo instance is created.
                maxLength: 512
                minLength: 1
                type: string
              sshKeyGroupIds:
                description: SSHKeyGroupIDs are the allowed SSH key group IDs for
                  Serial over LAN access.
                items:
                  type: string
                type: array
            required:
            - interfaces
            type: object
            x-kubernetes-validations:
            - message: exactly one of instanceTypeId or machineId must be set
              rule: has(self.instanceTypeId) != has(self.machineId)
          status:
            description: NicoMachineStatus defines the observed state of NicoMachine.
            properties:
              addresses:
                description: Addresses contains addresses observed on the backing
                  instance.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions describes the current machine state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              initialization:
                description: Initialization provides provisioning observations for
                  the backing instance.
                minProperties: 1
                properties:
                  provisioned:
                    description: Provisioned is true once the backing instance has
                      been created.
                    type: boolean
                type: object
              instanceId:
                description: InstanceID is the instance identifier backing this machine.
                type: string
              machineId:
                description: MachineID is the machine ID for this machine.
                type: string
              ready:
                description: Ready is true once the backing instance reaches Ready.
                type: boolean
              tpmEkPubHash:
                description: TpmEkPubHash is the TPM EK public hash for this machine.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
