name: Feature Request
description: Request new or improved functionality
title: "[FEA]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request.

  - type: dropdown
    id: new_or_improvement
    attributes:
      label: Is this a new feature, an improvement, or a change to existing functionality?
      options:
        - New Feature
        - Improvement
        - Change
    validations:
      required: true

  - type: dropdown
    id: criticality
    attributes:
      label: How would you describe the priority of this feature request?
      options:
        - Critical (currently preventing usage)
        - High
        - Medium
        - Low (would be nice)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this feature solves
      description: Real usage examples are especially helpful.
    validations:
      required: true

  - type: textarea
    id: Feature_Description
    attributes:
      label: Feature description
      description: Describe the desired behavior and how it fits Cluster API / NICo workflows.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Ideal solution
      description: Optional sketch of the API or controller behavior you want.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or providers you evaluated.

  - type: textarea
    id: misc
    attributes:
      label: Additional context

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/dsx-ai-factory/cluster-api-provider-nico/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow cluster-api-provider-nico's Code of Conduct
          required: true
        - label: I have searched open issues and found no duplicates for this feature request
          required: true
