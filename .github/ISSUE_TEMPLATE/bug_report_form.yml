name: Bug Report
description: File a bug report
title: "[BUG]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Do **not** include credentials, kubeconfigs, or other secrets.

  - type: input
    id: version
    attributes:
      label: Version
      description: Provider version, tag, or commit SHA.
      placeholder: "example: v0.0.29 or e1a0997"
    validations:
      required: true

  - type: dropdown
    id: installation-method
    attributes:
      label: Which installation method(s) does this occur on?
      multiple: true
      options:
        - clusterctl / release manifests
        - Helm chart
        - Kustomize (config/default)
        - Source / local build
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kubernetes version, Cluster API version, management-cluster OS/arch, and NICo-related context (no secrets).
      placeholder: |
        Kubernetes: v1.xx
        Cluster API: v1.xx
        Provider: v0.0.xx
    validations:
      required: true

  - type: textarea
    id: mvr
    attributes:
      label: Steps to reproduce
      description: Minimal steps or manifests that reproduce the issue (redact secrets).
      render: markdown

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant controller logs with secrets redacted.
      render: shell

  - type: textarea
    id: misc
    attributes:
      label: Additional context
      description: Anything else that might help triage.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/dsx-ai-factory/cluster-api-provider-nico/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow cluster-api-provider-nico's Code of Conduct
          required: true
        - label: I have searched open issues and found no duplicates for this bug report
          required: true
