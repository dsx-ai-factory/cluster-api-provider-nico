version: 2
updates:
  # Go modules — root module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The Kubernetes staging modules — k8s.io/api, k8s.io/apimachinery,
      # k8s.io/client-go, k8s.io/apiextensions-apiserver — are released in
      # lockstep and only work as a matched set. Cluster API and
      # controller-runtime are pinned to a Kubernetes minor the same way, so
      # sigs.k8s.io/* rides along in this group.
      #
      # Ungrouped, one patch set arrives as three separate PRs (see #113, #114,
      # #115 for k8s.io 0.36.3 -> 0.36.4) and merging them one at a time leaves
      # main on a mixed set. On a minor hop that mixed set does not resolve at
      # all: a staging module that drops an API group still gets imported by the
      # client-go one minor behind, via its kubernetes/scheme package.
      #
      # They get a group of their own, rather than sharing one with everything
      # else, so that failing to find a consistent set fails on its own instead
      # of taking every other dependency in the tree with it.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  # Go modules — kubebuilder layout plugin module
  - package-ecosystem: "gomod"
    directory: "/hack/kubebuilder/plugins/capnico-layout/v1"
    schedule:
      interval: "weekly"
    # This module carries no k8s.io/sigs.k8s.io requirements today. The split is
    # stated anyway so it behaves like the root module if that changes.
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Container base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # Keep the Go minor version fixed. Patch bumps such as 1.26.6 to 1.26.7
      # still come through. A minor bump such as 1.26 to 1.27 also needs the go
      # directive in every go.mod to move, so we do that by hand.
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    # Note: golang RC tags (e.g. golang:1.27rc1) do not follow semver, so
    # Dependabot's `versions` filter cannot match them with a range expression.
    # Close any RC-bump PRs manually; they resolve on their own once the stable
    # release is available and Dependabot replaces them.
