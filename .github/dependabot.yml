version: 2
updates:
  # Go modules — root module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go modules — kubebuilder layout plugin module
  - package-ecosystem: "gomod"
    directory: "/hack/kubebuilder/plugins/capnico-layout/v1"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Container base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
