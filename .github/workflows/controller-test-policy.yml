name: Controller Test Policy

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  controller-test-policy:
    name: Require envtest fixtures only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Ginkgo
        run: make ginkgo

      - name: Reject non envtest fixture tests
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          policy_packages=(
            ./controllers/...
          )
          test_files="$(
            {
              for package in "${policy_packages[@]}"; do
                directory="${package#./}"
                if [[ "${directory}" == */... ]]; then
                  find "${directory%/...}" -name '*_test.go' ! -type d -print
                else
                  find "${directory}" -maxdepth 1 -name '*_test.go' ! -type d -print
                fi
              done
              jq -r '.ginkgoSpecs | keys[]' .github/controller-test-policy.json
            } | LC_ALL=C sort -u
          )"
          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue
            expected="$(jq -r --arg file "${file}" '.ginkgoSpecs[$file] // 0' .github/controller-test-policy.json)"
            actual="$(
              ./bin/ginkgo outline --format json "${file}" |
                jq '[.. | objects | select(.spec == true)] | length'
            )"

            if ((actual != expected)); then
              echo "::error file=${file}::Found ${actual} Ginkgo specs; expected ${expected}. Add a YAML fixture under controllers/testdata instead."
              failed=1
            fi
          done <<< "${test_files}"

          expected_ordinary_tests="$(jq -r '.ordinaryGoTests[]' .github/controller-test-policy.json)"
          actual_ordinary_tests="$(
            go test "${policy_packages[@]}" -run '^$' -list '^(Test|Benchmark|Fuzz)' |
              awk '/^(Test|Benchmark|Fuzz)[[:alnum:]_]*$/ { print }' |
              LC_ALL=C sort
          )"
          if [[ "${actual_ordinary_tests}" != "${expected_ordinary_tests}" ]]; then
            echo "::error file=controllers::The ordinary Go test allowlist changed. Add controller coverage as YAML fixtures under controllers/testdata instead."
            echo "Expected:"
            printf '%s\n' "${expected_ordinary_tests:-<none>}"
            echo "Found:"
            printf '%s\n' "${actual_ordinary_tests:-<none>}"
            failed=1
          fi

          if ((failed)); then
            echo "See docs/writing-tests.md."
            exit 1
          fi

          echo "Controller test policy passed."
