name: Test

# Self-hosted runners do not pick up jobs from pull_request events, so pull
# requests are tested through the pull-request/<number> branch instead.
# workflow_call is declared so merge-gate.yml can call this as a reusable
# workflow, and the jobs run on ubuntu-latest so that call works from a real
# pull_request event. Self-hosted runners do not receive fork pull_request
# events, so a gate built on them would queue forever instead of reporting.
#
# Nothing here needs an NVIDIA runner: this module has no internal dependencies.
#
# This lands ahead of the gate on purpose. A local `uses: ./.github/workflows/...`
# reference resolves against the BASE branch, so a workflow whose workflow_call
# trigger exists only on a pull-request head cannot be called from that same
# pull request -- the call fails with no jobs and no error message.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches
      # neither of the two above, so none of this CI ran on a dependency
      # bump. The bump merged on the strength of Dependabot's own testing.
      - "dependabot/**"
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test
