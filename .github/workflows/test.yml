name: Test

# The merge gate calls this workflow for pull requests and main. The jobs run on
# ubuntu-latest because self-hosted runners do not receive fork pull_request
# events. Nothing here needs an NVIDIA runner because this module has no
# internal dependencies.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: Test-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: unit
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

      - name: Verify generated files and formatting are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files or formatting are out of date. Run 'make generate manifests fmt' and commit the result."
            exit 1
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Run end-to-end tests
        run: make test-e2e
