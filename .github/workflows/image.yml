name: Image

# Publishes multi-arch images to GHCR. GitLab still publishes the same commit to
# NGC for DSX (see .gitlab-ci.yml); the two pipelines are independent.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nvidia/cluster-api-provider-nico

jobs:
  build:
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
            platform: linux/amd64
          - arch: arm64
            runner: linux-arm64-cpu16
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docker-container driver runs BuildKit in its own container, so it
      # does not inherit the daemon's registry-mirror configuration. NVIDIA
      # runners ship a prepopulated buildkitd.toml pointing at the local mirror;
      # use it when present so base-image pulls are cached and not subject to
      # Docker Hub rate limits. Absent, buildx is set up exactly as before.
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          sha_tag="sha-${GITHUB_SHA}-${arch}"
          tags=("${IMAGE}:${sha_tag}")

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags+=("${IMAGE}:edge-${arch}")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
            tags+=("${IMAGE}:${version}-${arch}")
          fi

          {
            echo "sha_tag=${sha_tag}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TARGETOS=linux
            TARGETARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=capnico-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=capnico-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  sbom:
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    name: SBOM (${{ matrix.arch }})
    runs-on: linux-amd64-cpu8
    needs: [build]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          format: spdx-json
          artifact-name: cluster-api-provider-nico-sbom-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

  manifest:
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    name: Multi-arch manifest
    runs-on: linux-amd64-cpu8
    needs: [build]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker-container driver runs BuildKit in its own container, so it
      # does not inherit the daemon's registry-mirror configuration. NVIDIA
      # runners ship a prepopulated buildkitd.toml pointing at the local mirror;
      # use it when present so base-image pulls are cached and not subject to
      # Docker Hub rate limits. Absent, buildx is set up exactly as before.
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      - name: Create multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          aliases=("sha-${GITHUB_SHA}")

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            aliases+=("edge")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            aliases+=("${GITHUB_REF_NAME}")
          fi

          for alias in "${aliases[@]}"; do
            docker buildx imagetools create \
              -t "${IMAGE}:${alias}" \
              "${IMAGE}:${alias}-amd64" \
              "${IMAGE}:${alias}-arm64"
          done
