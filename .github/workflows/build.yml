#
# Compiles every package in the module.
#
# Nothing here did that on its own before. The code was compiled only as a side
# effect of other jobs -- golangci-lint type-checks, and the container image
# build compiles the binary inside Docker -- so a compile break was reported by
# a linter or an image build rather than by a build.
#
# It runs `make binary`, not raw go commands, so the failure is reproducible
# locally with the identical command. That target compiles every package and
# links the manager binary, and deliberately skips the `manifests generate fmt
# vet` prerequisites `make build` carries: those rewrite generated files and
# need controller-gen, which does not belong in a compile check.

name: Build

# Self-hosted runners do not pick up jobs from pull_request events, so pull
# requests are tested through the pull-request/<number> branch instead.
# workflow_call is declared so merge-gate.yml can call this as a reusable
# workflow, and the jobs run on ubuntu-latest so that call works from a real
# pull_request event. Self-hosted runners do not receive fork pull_request
# events, so a gate built on them would queue forever instead of reporting.
#
# Nothing here needs an NVIDIA runner: this module has no internal dependencies.
#
# This lands ahead of the gate on purpose. A local `uses: ./.github/workflows/...`
# reference resolves against the BASE branch, so a workflow whose workflow_call
# trigger exists only on a pull-request head cannot be called from that same
# pull request -- the call fails with no jobs and no error message.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches neither
      # of the two above. Without this a dependency bump was never compiled.
      - "dependabot/**"
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: Build-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: go build
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make binary

      - name: Vet
        run: go vet ./...

      # go.mod and go.sum must already be tidy. Runs last so a tidy failure
      # cannot mask a compile failure.
      #
      # Nothing else asserts this. test-chart.yml runs `go mod tidy` before it
      # builds, which rewrites go.mod at runtime and reports nothing, so an
      # untidy file reaches main looking green.
      - name: Check go.mod and go.sum are tidy
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          }
