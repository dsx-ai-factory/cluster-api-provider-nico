#
# Builds the container image and throws it away.
#
# PR verify companion to `image-nvcr.yml`. Without this, a broken Dockerfile
# would only surface after merge, when the publish build failed.
#
# The cache scope is shared with `image-nvcr.yml` on purpose: same Dockerfile,
# same platforms, same build-args. This is the only workflow that writes it, so
# verify builds warm the publish build rather than competing with it for the
# repository's 10 GB cache budget.
#
# `push: false`, so this needs no registry credentials and no `packages` scope.
#
# The path filter is derived from `.dockerignore`, which is what actually
# defines the build context: `**/*.go` excluding tests, go.mod, go.sum, LICENSE,
# NOTICE, THIRD_PARTY_NOTICES.md and vendor/**. Listing source directories
# instead looks tidier and is wrong — deleting THIRD_PARTY_NOTICES.md breaks the
# final `COPY` and would not have matched. `vendor/**` is listed even though
# `**.go` covers vendored Go source, because vendor/modules.txt and the vendored
# licence files change on their own. If `.dockerignore` changes, change this
# with it.

name: Image Build

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches
      # neither of the two above, so none of this CI ran on a dependency
      # bump. The bump merged on the strength of Dependabot's own testing.
      - "dependabot/**"
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '**.go'
      - 'vendor/**'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/image-build.yml'
  workflow_dispatch: {}

permissions: {}

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: Image Build-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
            platform: linux/amd64
          - arch: arm64
            runner: linux-arm64-cpu16
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docker-container driver runs BuildKit in its own container, so it
      # does not inherit the daemon's registry-mirror configuration. Use the
      # runner's config when present; absent, buildx is set up as normal.
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      # cache-to only from main. A cache written on a pull-request/N branch can
      # be read by nothing else — GitHub restores caches from the current ref or
      # the default branch only — so it returns nothing and evicts entries the
      # rest of CI does depend on, against a 10 GB per-repository ceiling.
      # cache-from stays on every branch, because main's cache is readable
      # everywhere.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          provenance: false
          build-args: |
            TARGETOS=linux
            TARGETARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=capnico-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=capnico-{0}', matrix.arch) || '' }}
