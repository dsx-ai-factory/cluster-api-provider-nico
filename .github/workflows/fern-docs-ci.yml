# Validates Fern docs configuration on pull requests that touch docs/ or fern/.
#
# `fern check` validates docs.yml/nav configuration -- it does not parse MDX,
# so a construct that is valid CommonMark but aborts `fern generate --docs` at
# publish time will not be caught here. This is an advisory check, not a
# required merge-gate job.

name: Fern Docs CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)"

      - name: Check MDX safety
        # Intentionally inline -- a composite action would add indirection without benefit for a single grep.
        run: |
          BAD=$(grep -rn '<img\b[^>]*[^/]>\|<img>' docs/ fern/ --include="*.md" --include="*.mdx" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Non-self-closing <img> tags found (MDX requires <img ... />):"
            echo "$BAD"
            exit 1
          fi

      - name: Checkout frozen version content
        run: |
          set -eo pipefail
          for version_file in fern/versions/v*.yml; do
            [ -f "$version_file" ] || continue
            version=$(basename "$version_file" .yml)
            if git show-ref --verify --quiet "refs/tags/${version}"; then
              mkdir -p "fern/versions/${version}-content"
              git archive "refs/tags/${version}" -- docs/ | tar -x --strip-components=1 -C "fern/versions/${version}-content"
              # Escape {, }, < for MDX -- but only outside fenced code blocks and inline code spans
              find "fern/versions/${version}-content" -name '*.md' -print0 | while IFS= read -r -d '' f; do
                awk '
                  /^````*/ || /^~~~~*/ { fence = !fence; print; next }
                  fence { print; next }
                  {
                    n = split($0, p, "`")
                    out = ""
                    for (i = 1; i <= n; i++) {
                      if (i % 2 == 1) {
                        gsub(/{/, "\\{", p[i])
                        gsub(/}/, "\\}", p[i])
                        gsub(/</, "\\&lt;", p[i])
                      }
                      out = out p[i]
                      if (i < n) out = out "`"
                    }
                    print out
                  }
                ' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              done
              echo "Extracted docs from $version"
            else
              echo "::warning::Tag $version not found — skipping content checkout"
            fi
          done

      - name: Fern check
        run: fern check

      - name: Check for broken links
        # --fallback-extensions md: internal links drop the .md suffix to
        # match Fern's published routes (see PR #171); lychee checks the raw
        # markdown source, so without this every such link 404s here even
        # though it resolves fine on the actual site.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --fallback-extensions md 'docs/**/*.md'
          fail: true
