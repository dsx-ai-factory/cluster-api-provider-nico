name: NVCR

# Builds every `main` commit and publishes it to the NKE and DSX orgs on
# nvcr.io. This is the only workflow that builds a published image: releases are
# promotions of a `sha-<commit>` digest from here, never a rebuild, so a tag
# ships the artifact that was already running as `edge`. See release.yml.
#
# The two orgs share the nvcr.io host but need different NGC keys, and a Docker
# config holds one credential per host, so each destination gets its own job
# rather than one build pushing both tags.
#
# Destinations come from the `nvcr` environment's variables rather than being
# written here, so a repository move does not need a code change:
#
#   NVCR_NKE_IMAGE  nvcr.io/<nke-org>/cluster-api-provider-nico
#   NVCR_DSX_IMAGE  nvcr.io/<dsx-org>/<team>/cluster-api-provider-nico
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: NVCR-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    name: Build ${{ matrix.dest.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: nvcr
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        dest:
          - name: nke
            var: NVCR_NKE_IMAGE
            secret: NVCR_NKE_AUTH_TOKEN
          - name: dsx
            var: NVCR_DSX_IMAGE
            secret: NGC_REGISTRY_TOKEN_DSX
        include:
          - arch: amd64
            runner: linux-amd64-cpu16
            platform: linux/amd64
          - arch: arm64
            runner: linux-arm64-cpu16
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See image-build.yml: BuildKit runs in its own container and needs the
      # runner's registry-mirror config when one is present.
      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      # `$oauthtoken` is NGC's literal username, not a variable reference.
      - name: Login to NVCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets[matrix.dest.secret] }}

      - name: Image tags
        id: meta
        shell: bash
        env:
          IMAGE: ${{ vars[matrix.dest.var] }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" ]]; then
            echo "::error::${{ matrix.dest.var }} is not set in the nvcr environment"
            exit 1
          fi

          arch="${{ matrix.arch }}"
          tags=(
            "${IMAGE}:sha-${GITHUB_SHA}-${arch}"
            "${IMAGE}:edge-${arch}"
            "${IMAGE}:latest-${arch}"
          )

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # Reads the cache scope image-build.yml writes from main (identical
      # Dockerfile and build-args) without writing it, so the two do not race for
      # the repository's 10 GB cache budget.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TARGETOS=linux
            TARGETARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=capnico-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    name: Manifest ${{ matrix.dest.name }}
    runs-on: linux-amd64-cpu8
    needs: [build]
    environment: nvcr
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dest:
          - name: nke
            var: NVCR_NKE_IMAGE
            secret: NVCR_NKE_AUTH_TOKEN
          - name: dsx
            var: NVCR_DSX_IMAGE
            secret: NGC_REGISTRY_TOKEN_DSX
    steps:
      - name: Login to NVCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets[matrix.dest.secret] }}

      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      - name: Create multi-arch manifests
        shell: bash
        env:
          IMAGE: ${{ vars[matrix.dest.var] }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" ]]; then
            echo "::error::${{ matrix.dest.var }} is not set in the nvcr environment"
            exit 1
          fi

          # sha-<commit> is the digest releases are promoted from, so it has to
          # exist for every commit, not just the ones that get tagged.
          aliases=("sha-${GITHUB_SHA}" "edge" "latest")

          for alias in "${aliases[@]}"; do
            docker buildx imagetools create \
              -t "${IMAGE}:${alias}" \
              "${IMAGE}:${alias}-amd64" \
              "${IMAGE}:${alias}-arm64"
          done
