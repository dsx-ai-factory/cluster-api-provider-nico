#
# Lints the workflow files themselves.
#
# A workflow that fails to parse, or that references a job output or secret that
# does not exist, produces a run with no jobs and no useful error. Nothing here
# checked for that. `cluster-api-provider-launchlayer` has run actionlint inside
# its merge gate for a while; this is the same check for a repository without a
# merge gate.
#
# Runs on ubuntu-latest. actionlint is a static binary that reads YAML — it needs
# no Docker, no private dependency and no NVIDIA runner, so it should not consume
# self-hosted capacity, and a contributor working from a fork can see it.

name: Actionlint

# workflow_call is declared so merge-gate.yml can call this as a reusable
# workflow, and the jobs run on ubuntu-latest so that call works from a real
# pull_request event. Self-hosted runners do not receive fork pull_request
# events, so a gate built on them would queue forever instead of reporting.
#
# Nothing here needs an NVIDIA runner: this module has no internal dependencies.
#
# This lands ahead of the gate on purpose. A local `uses: ./.github/workflows/...`
# reference resolves against the BASE branch, so a workflow whose workflow_call
# trigger exists only on a pull-request head cannot be called from that same
# pull request -- the call fails with no jobs and no error message.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches
      # neither of the two above, so none of this CI ran on a dependency
      # bump. The bump merged on the strength of Dependabot's own testing.
      - "dependabot/**"
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  workflow_call:
  workflow_dispatch: {}

permissions: {}

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: Actionlint-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prebuilt binary rather than `go run`, which would compile actionlint
      # from source on every run. The checksum is verified against the release
      # the version pins, so a compromised download fails closed.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tar="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tmp="$(mktemp -d)"

          curl -fsSL -o "${tmp}/${tar}" "${base}/${tar}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"

          expected="$(awk -v t="${tar}" '$2 == t {print $1}' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::no checksum entry for ${tar}"
            exit 1
          fi
          actual="$(sha256sum "${tmp}/${tar}" | awk '{print $1}')"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::checksum mismatch for ${tar}"
            exit 1
          fi

          tar -xzf "${tmp}/${tar}" -C "${tmp}" actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${tmp}/actionlint" "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Lint the workflows
        run: actionlint
