# Scans the commit history reachable from HEAD for credentials, and fails if it
# finds one.
#
# The whole reachable history rather than only the commits a pull request adds.
# That is affordable because this repository's history is clean today, verified
# with gitleaks 8.30.1 before this job was written, so the check starts green
# and any red is a real regression. NVIDIA/nke scans only the pull request range
# instead, because its two bulk import commits already carry 79 matches and a
# check that is always red gets ignored within a week.
#
# This overlaps with GitHub secret scanning, which is enabled on this
# repository. It is not redundant: secret scanning matches partner-issued
# token formats, while gitleaks also catches high-entropy strings and
# self-issued credentials that no provider will ever claim.
#
# What this job is for: catching a credential committed by accident. It is not
# a control against someone who wants to smuggle one past it. Anything that
# stops git printing a diff — a `-diff` attribute, a NUL byte in the file —
# hides content from any scanner driven by `git log -p`. The cheap and obvious
# switches are closed below; the rest is why push protection is on as well.
#
# --diff-merges=first-parent is load-bearing. `git log -p` prints no diff at all
# for a merge commit, so without it every merge is skipped in silence —
# including the ones GitHub's "Update branch" button and the web conflict editor
# create. A secret added while resolving a conflict would pass unseen.
# --diff-merges=cc does not help either, but the reason is gitleaks and not git:
# git does print a combined diff, and gitleaks' parser drops that format.

name: Secrets

# Self-hosted runners do not pick up jobs from pull_request events, so pull
# requests arrive as pushes to the pull-request/<number> branch that
# copy-pr-bot creates. Scanning reachable history needs no second end of a
# range, so unlike the nke job this one can also run on main.
# workflow_call is declared so merge-gate.yml can call this as a reusable
# workflow, and the jobs run on ubuntu-latest so that call works from a real
# pull_request event. Self-hosted runners do not receive fork pull_request
# events, so a gate built on them would queue forever instead of reporting.
#
# Nothing here needs an NVIDIA runner: this module has no internal dependencies.
#
# This lands ahead of the gate on purpose. A local `uses: ./.github/workflows/...`
# reference resolves against the BASE branch, so a workflow whose workflow_call
# trigger exists only on a pull-request head cannot be called from that same
# pull request -- the call fails with no jobs and no error message.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches
      # neither of the two above, so none of this CI ran on a dependency
      # bump. The bump merged on the strength of Dependabot's own testing.
      - "dependabot/**"
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: Secrets-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    name: gitleaks
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history is the subject of the scan, so all of it is needed.
          fetch-depth: 0
          persist-credentials: false

      # A prebuilt binary, checked against a digest written down here rather
      # than one fetched alongside it. A checksums file from the same release
      # over the same channel only detects a corrupted transfer: anyone able to
      # replace the tarball can replace the checksums next to it.
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dir}/bin"

          curl -fsSL --retry 3 --retry-delay 2 -o "${dir}/${tarball}" "${url}"

          actual="$(sha256sum "${dir}/${tarball}" | awk '{print $1}')"
          if [ "${actual}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::checksum mismatch for ${tarball}: got ${actual}"
            exit 1
          fi

          tar -xzf "${dir}/${tarball}" -C "${dir}" gitleaks
          # RUNNER_TEMP is per job, so two jobs on one self-hosted runner cannot
          # overwrite each other's binary mid-execution.
          install -m 0755 "${dir}/gitleaks" "${dir}/bin/gitleaks"
          echo "${dir}/bin" >> "${GITHUB_PATH}"
          rm -f "${dir}/${tarball}"

      - name: Scan the history for committed secrets
        shell: bash
        run: |
          set -euo pipefail

          # gitleaks reads its configuration from the tree it scans, so a pull
          # request can switch the scanner off in the same commit that adds a
          # secret. Verified against 8.30.1: a .gitleaksignore holding a
          # finding's fingerprint takes a real leak from "leaks found: 1" to
          # "no leaks found", and --gitleaks-ignore-path does not override it.
          # Neither file exists here, so refuse to run rather than report a
          # clean scan that means nothing. .gitattributes is on the list for a
          # different reason: one `path -diff` line makes git print
          # "Binary files differ" instead of the content, and gitleaks then
          # reads nothing from that path while still counting the commit.
          for f in .gitleaks.toml .gitleaksignore .gitattributes; do
            if [ -e "${f}" ] || [ -L "${f}" ]; then
              echo "::error::${f} is present and can change what this scan reports."
              echo "Adding it has to be a deliberate, reviewed change to this workflow."
              exit 1
            fi
          done

          # --config beats GITLEAKS_CONFIG beats GITLEAKS_CONFIG_TOML beats the
          # file in the tree. The guard above only covers the last of those, and
          # self-hosted runners carry a persistent environment, so clear the
          # other two rather than assume they are unset.
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML

          out="${RUNNER_TEMP}/gitleaks.log"

          # --redact keeps a finding out of the job log, which anyone who can
          # see the run can read. --verbose is safe alongside it and is what
          # makes a failure actionable: file, line, commit and rule, with the
          # secret itself shown as REDACTED.
          set +e
          gitleaks git . --no-banner --redact --verbose --ignore-gitleaks-allow \
            --log-opts="HEAD --diff-merges=first-parent" > "${out}" 2>&1
          status=$?
          set -e
          cat "${out}"

          # gitleaks throws away git's exit code, and aborts the scan when git
          # writes anything unexpected to stderr — then still exits 0 reporting
          # "no leaks found". A benign warning about an unreadable gitconfig is
          # enough. Reproduced against 8.30.1, where it logs this exact line, so
          # its absence is the thing worth asserting rather than its exit status.
          #
          # -a on every grep here: the log carries matched source lines, so a
          # Latin-1 file makes GNU grep call it binary and print nothing, which
          # would turn a real finding into "the scan did not run".
          if grep -qa 'stderr is not empty' "${out}"; then
            echo "::error::gitleaks stopped early because git wrote to stderr, and it reports success when that happens. Treat this as a failed scan, not a clean one."
            exit 1
          fi

          # Deliberately not compared against `git rev-list --count HEAD`.
          # gitleaks counts only commits that contribute an added text line, so
          # an empty commit, a binary file, a pure rename, a mode change or a
          # delete-only commit legitimately lowers its number, and an equality
          # check would turn main red on an ordinary commit.
          scanned="$(grep -oaE '[0-9]+ commits scanned' "${out}" | tail -1 | grep -oaE '^[0-9]+' || true)"
          case "${scanned}" in
            ''|*[!0-9]*)
              echo "::error::gitleaks reported no commit count. The scan did not run."
              exit 1 ;;
            0)
              echo "::error::gitleaks scanned 0 commits. A clean result here proves nothing."
              exit 1 ;;
          esac
          echo "  ${scanned} commit(s) scanned"

          if [ "${status}" -ne 0 ]; then
            if grep -q 'leaks found:' "${out}"; then
              echo "::error::gitleaks found a credential in this repository's history."
              echo
              echo "The finding above names the commit. Remove the secret from every"
              echo "commit that carries it — deleting it in a later commit leaves it"
              echo "in the history, where it is still leaked:"
              echo "  git rebase -i <the commit before it>"
              echo
              echo "Then rotate it. Treat anything that reached a remote as public."
            else
              echo "::error::gitleaks exited ${status} without reporting a finding. That is a tool failure, not a leaked credential."
            fi
            exit 1
          fi
