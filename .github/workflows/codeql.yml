#
# CodeQL static analysis for Go. Results go to Security -> Code scanning.
#
# `build-mode: manual` because CodeQL has to observe a real compile to build its
# database. The build runs in GO_MODULE, so the analysis covers that module.
#
# The root module is covered. hack/kubebuilder/plugins/capnico-layout/v1 is
# a separate module holding a scaffolding plugin, and is not scanned.

name: CodeQL

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: CodeQL-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Go module to analyse, relative to the repository root.
  GO_MODULE: .

jobs:
  analyze:
    name: Analyze Go
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_MODULE }}/go.mod
          cache: true
          cache-dependency-path: ${{ env.GO_MODULE }}/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          build-mode: manual

      - name: Build
        working-directory: ${{ env.GO_MODULE }}
        run: go build ./...

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:go"
