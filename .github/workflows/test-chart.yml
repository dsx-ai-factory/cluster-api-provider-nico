name: Test Chart

# Self-hosted runners do not pick up jobs from pull_request events, so pull
# requests are tested through the pull-request/<number> branch instead.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches
      # neither of the two above, so none of this CI ran on a dependency
      # bump. The bump merged on the strength of Dependabot's own testing.
      - "dependabot/**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "PROJECT"
      - "Dockerfile"
      - "chart/**"
      - "config/**"
      - "test/helm/**"
      - "hack/helm-chart-fixups.sh"
      - "hack/release-manifests.sh"
      - ".github/workflows/test-chart.yml"
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: e2e
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/cluster-api-provider-nico'
    env:
      HELM_NAMESPACE: capnico-system
      HELM_RELEASE: capi-provider-nico
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          # -f matters as much as the retries here: without it curl writes the
          # error page to ./kind and the failure only surfaces when the binary
          # is executed.
          curl --retry 3 --retry-delay 5 --retry-connrefused -fLo ./kind \
            "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      # No `go mod tidy` here. It rewrites go.mod at runtime and reports
      # nothing; the Build workflow checks tidiness and fails when it is wrong.
      - name: Prepare cluster-api-provider-nico
        run: |
          make docker-build
          kind load docker-image "$IMG"

          legacy_chart="${RUNNER_TEMP}/legacy-chart"
          legacy_release="${RUNNER_TEMP}/legacy-release"
          cp -R test/helm/legacy-chart "${legacy_chart}"
          mkdir -p "${legacy_chart}/files"
          make release-manifests RELEASE_DIR="${legacy_release}" CONTROLLER_IMG="$IMG"
          cp "${legacy_release}/infrastructure-components.yaml" \
            "${legacy_chart}/files/infrastructure-components.yaml"
          echo "LEGACY_CHART=${legacy_chart}" >> "${GITHUB_ENV}"

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./chart

      - name: Verify native install and CRD retention
        run: |
          make helm-deploy
          make helm-status
          make helm-uninstall

          # Deletion without --ignore-not-found doubles as the retention
          # assertion: Helm uninstall must have left every CRD behind.
          kubectl delete customresourcedefinition \
            nicoclusters.infrastructure.cluster.x-k8s.io \
            nicoclustertemplates.infrastructure.cluster.x-k8s.io \
            nicomachines.infrastructure.cluster.x-k8s.io \
            nicomachinetemplates.infrastructure.cluster.x-k8s.io \
            --wait=true
          kubectl delete namespace "${HELM_NAMESPACE}" --wait=true

      - name: Verify legacy-to-native upgrade
        run: |
          helm upgrade --install "${HELM_RELEASE}" "${LEGACY_CHART}" \
            --namespace "${HELM_NAMESPACE}" \
            --create-namespace \
            --wait \
            --timeout 5m

          legacy_uid="$(kubectl get deployment controller-manager \
            --namespace "${HELM_NAMESPACE}" \
            --output jsonpath='{.metadata.uid}')"
          legacy_selector="$(kubectl get deployment controller-manager \
            --namespace "${HELM_NAMESPACE}" \
            --output json | jq -cS '.spec.selector')"

          make helm-deploy

          native_uid="$(kubectl get deployment controller-manager \
            --namespace "${HELM_NAMESPACE}" \
            --output jsonpath='{.metadata.uid}')"
          native_selector="$(kubectl get deployment controller-manager \
            --namespace "${HELM_NAMESPACE}" \
            --output json | jq -cS '.spec.selector')"

          test "${native_uid}" = "${legacy_uid}"
          test "${native_selector}" = "${legacy_selector}"
          kubectl rollout status deployment/controller-manager \
            --namespace "${HELM_NAMESPACE}" \
            --timeout 5m
          make helm-status

          make helm-uninstall
          for crd in \
            nicoclusters.infrastructure.cluster.x-k8s.io \
            nicoclustertemplates.infrastructure.cluster.x-k8s.io \
            nicomachines.infrastructure.cluster.x-k8s.io \
            nicomachinetemplates.infrastructure.cluster.x-k8s.io; do
            kubectl get customresourcedefinition "${crd}"
          done
