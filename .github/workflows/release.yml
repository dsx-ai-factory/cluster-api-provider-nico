name: Release

# Releases are promotions, not builds. image-nvcr.yml builds every `main` commit
# and publishes it to NVCR as `sha-<commit>`; a tag renames that exact digest and
# copies it to GHCR. A release therefore ships the artifact that has already been
# running as `edge`, byte for byte, and `v1.2.3-rc.1` and `v1.2.3` are the same
# image whenever they name the same commit.
#
# The consequence is that a tag has to point at a commit that was built on
# `main`. Tagging anything else fails rather than quietly building something new.
#
# Reads the `nvcr` environment's NVCR_NKE_IMAGE (the promotion source),
# NVCR_DSX_IMAGE, DSX_NGC_ORG and DSX_NGC_TEAM.
on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: Release-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Both NVCR orgs are on nvcr.io but take different NGC keys, and a Docker
  # config holds one credential per host, so they cannot share a job.
  promote-nvcr:
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    name: Tag NVCR (${{ matrix.dest.name }})
    runs-on: linux-amd64-cpu16
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dest:
          - name: nke
            var: NVCR_NKE_IMAGE
            secret: NVCR_NKE_AUTH_TOKEN
          - name: dsx
            var: NVCR_DSX_IMAGE
            secret: NGC_REGISTRY_TOKEN_DSX
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make crane` downloads the released binary now, not `go install`s it,
      # so this job no longer needs a Go toolchain.
      - name: Build crane
        run: make crane

      # `$oauthtoken` is NGC's literal username, not a variable reference.
      - name: Login to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets[matrix.dest.secret] }}

      # `crane tag` repoints a tag at an existing digest without transferring
      # anything, so this publishes no new bits.
      - name: Tag the release digest
        shell: bash
        env:
          IMAGE: ${{ vars[matrix.dest.var] }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" ]]; then
            echo "::error::${{ matrix.dest.var }} is not set in the nvcr environment"
            exit 1
          fi

          src="${IMAGE}:sha-${GITHUB_SHA}"
          if ! digest="$(bin/crane digest "${src}")"; then
            echo "::error::${src} does not exist. A release tag has to point at a commit that was built and published from main."
            exit 1
          fi

          bin/crane tag "${src}" "${GITHUB_REF_NAME}"
          echo "- \`${IMAGE}:${GITHUB_REF_NAME}\` is \`${digest}\`" >> "${GITHUB_STEP_SUMMARY}"

  # Cross-host, so this is the one promotion that can hold both credentials at
  # once: NKE to read, GHCR to write.
  promote-ghcr:
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    name: Promote to GHCR
    runs-on: linux-amd64-cpu16
    needs: [promote-nvcr]
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.promote.outputs.image }}
      digest: ${{ steps.promote.outputs.digest }}
      digest_amd64: ${{ steps.promote.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.promote.outputs.digest_arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make crane` downloads the released binary now, not `go install`s it,
      # so this job no longer needs a Go toolchain.
      - name: Build crane
        run: make crane

      - name: Login to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NVCR_NKE_AUTH_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the index is copied. Its per-arch children come with it, so the
      # per-arch tags NVCR carries as build byproducts stay off the public
      # registry; the SBOM job addresses those children by digest instead.
      - name: Copy the digest to GHCR
        id: promote
        shell: bash
        env:
          SOURCE: ${{ vars.NVCR_NKE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE}" ]]; then
            echo "::error::NVCR_NKE_IMAGE is not set in the nvcr environment"
            exit 1
          fi

          # Lowercased because GHCR rejects uppercase paths and the owner is NVIDIA.
          #
          # `/controller`, not the bare repository name, so the chart can
          # publish under <repo>/charts/ without the two sharing one OCI
          # repository. On the other two CAPI repos they did share one, told
          # apart only by whether the tag carried a "v".
          image="ghcr.io/${GITHUB_REPOSITORY,,}/controller"

          src="${SOURCE}:sha-${GITHUB_SHA}"
          if ! digest="$(bin/crane digest "${src}")"; then
            echo "::error::${src} does not exist. A release tag has to point at a commit that was built and published from main."
            exit 1
          fi

          bin/crane copy "${src}" "${image}:${GITHUB_REF_NAME}"
          bin/crane tag "${image}:${GITHUB_REF_NAME}" "sha-${GITHUB_SHA}"

          # Read the children off the source: the copy preserves digests, so
          # these are the same manifests, without a read-after-write on GHCR.
          {
            echo "image=${image}"
            echo "digest=${digest}"
            for arch in amd64 arm64; do
              echo "digest_${arch}=$(bin/crane digest --platform "linux/${arch}" "${src}")"
            done
          } >> "${GITHUB_OUTPUT}"

          {
            echo "- \`${image}:${GITHUB_REF_NAME}\` is \`${digest}\`"
            echo "- promoted from \`${src}\`, not rebuilt"
          } >> "${GITHUB_STEP_SUMMARY}"

  sbom:
    name: SBOM (${{ matrix.arch }})
    runs-on: linux-amd64-cpu16
    needs: [promote-ghcr]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, so this runs on an amd64 runner for either architecture.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ needs.promote-ghcr.outputs.image }}@${{ needs.promote-ghcr.outputs[format('digest_{0}', matrix.arch)] }}
          format: spdx-json
          artifact-name: cluster-api-provider-nico-sbom-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

  # security-scan.yml's grype job reads the source tree, which catches
  # vulnerable Go dependencies but not the base image's OS packages. This is
  # the only scan of the actual bits a consumer pulls. fail-build: false
  # matches that job too: reports, does not gate.
  scan-image:
    name: Scan image (${{ matrix.arch }})
    runs-on: linux-amd64-cpu16
    needs: [promote-ghcr]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read          # upload-sarif reads the workflow run
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Grype
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ needs.promote-ghcr.outputs.image }}@${{ needs.promote-ghcr.outputs[format('digest_{0}', matrix.arch)] }}
          severity-cutoff: medium
          output-format: sarif
          only-fixed: true
          fail-build: false

      - name: Summarise
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="${{ steps.scan.outputs.sarif }}"
          {
            echo "## Grype (image, ${{ matrix.arch }}) — medium severity and above, fixed versions only"
            echo
            if [ -z "${f}" ] || [ ! -s "${f}" ]; then
              echo "No SARIF produced. The scan did not finish."
            else
              echo "$(jq '[.runs[].results[]] | length' "${f}") result(s). Details in **Security -> Code scanning**, category \`grype-release-${{ matrix.arch }}\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload SARIF
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-release-${{ matrix.arch }}

  # Three chart jobs, because each package has to name an image its consumers
  # can reach. The native chart is identical apart from image defaults and the
  # NKE package's pull secret.
  chart-ngc:
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    name: Chart (NGC)
    runs-on: linux-amd64-cpu16
    needs: [promote-nvcr]
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install NGC CLI
        shell: bash
        env:
          NGC_CLI_VERSION: "4.34.10"
          NGC_CLI_SHA256: "58bc4d7b6901551a095ce5a43a0065b1c22d5eaf1a164d40029ee3fda11ccd47"
        run: |
          set -euo pipefail
          url="https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/${NGC_CLI_VERSION}/files/ngccli_linux.zip"

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL \
            -o ngccli_linux.zip "${url}"
          echo "${NGC_CLI_SHA256}  ngccli_linux.zip" | sha256sum -c -

          unzip -q -o ngccli_linux.zip
          chmod +x ngc-cli/ngc
          echo "$(pwd)/ngc-cli" >> "${GITHUB_PATH}"

      - name: Package chart
        shell: bash
        env:
          DSX_IMAGE: ${{ vars.NVCR_DSX_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -z "${DSX_IMAGE}" ]]; then
            echo "::error::NVCR_DSX_IMAGE is not set in the nvcr environment"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          sed -i \
            -e "s#^    repository: controller\$#    repository: ${DSX_IMAGE}#" \
            -e 's|^    # tag: ""$|    tag: ""|' \
            chart/values.yaml
          grep -Fqx "    repository: ${DSX_IMAGE}" chart/values.yaml \
            || { echo "::error::chart image rewrite did not apply"; exit 1; }
          grep -Fqx '    tag: ""' chart/values.yaml \
            || { echo "::error::chart tag was not cleared"; exit 1; }

          helm lint chart
          helm package chart \
            --version "${version}" \
            --app-version "${GITHUB_REF_NAME}" \
            --destination dist/capi-provider-nico

          chart_pkg="dist/capi-provider-nico/capi-provider-nico-${version}.tgz"
          rendered="$(helm template "${chart_pkg}")"
          grep -Fq "image: \"${DSX_IMAGE}:${GITHUB_REF_NAME}\"" <<< "${rendered}" \
            || { echo "::error::packaged chart names the wrong controller image"; exit 1; }

      - name: Push chart to NGC
        shell: bash
        env:
          NGC_CLI_API_KEY: ${{ secrets.NGC_REGISTRY_TOKEN_DSX }}
          NGC_CLI_ORG: ${{ vars.DSX_NGC_ORG }}
          NGC_CLI_TEAM: ${{ vars.DSX_NGC_TEAM }}
        run: |
          set -euo pipefail
          if [[ -z "${NGC_CLI_ORG}" || -z "${NGC_CLI_TEAM}" ]]; then
            echo "::error::DSX_NGC_ORG and DSX_NGC_TEAM must be set in the nvcr environment"
            exit 1
          fi

          target="${NGC_CLI_ORG}/${NGC_CLI_TEAM}/capi-provider-nico"

          if ! ngc registry chart info "${target}" > /dev/null 2>&1; then
            ngc registry chart create "${target}" \
              --short-desc "Helm chart for capi-provider-nico"
          fi

          # Re-running a release must not fail once the version is published.
          if ! out="$(ngc registry chart push "${target}:${GITHUB_REF_NAME#v}" \
                        --source dist/capi-provider-nico 2>&1)"; then
            printf '%s\n' "${out}"
            printf '%s\n' "${out}" | grep -qi "already exists"
          fi

  chart-nke:
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    name: Chart (NKE)
    runs-on: linux-amd64-cpu16
    needs: [promote-nvcr]
    environment: nvcr
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # values.yaml defaults to imagePullSecrets: [], which is fine for a
      # public registry but leaves a consumer who doesn't override it stuck in
      # ImagePullBackOff against nvcr.io/j7sbcjl3qgta. cloud-workflow-engine's
      # NKE chart job (chart-publish-nvcr.yml) sets the same default for the
      # same reason.
      - name: Set a default NKE image pull secret
        shell: bash
        run: |
          set -euo pipefail
          sed -i -e "s#^imagePullSecrets: \[\]\$#imagePullSecrets:\n  - name: svc-nke-ngc-imagepull#" \
            chart/values.yaml
          grep -q "^  - name: svc-nke-ngc-imagepull\$" chart/values.yaml \
            || { echo "::error::pull-secret rewrite did not apply"; exit 1; }

      - name: Package chart
        shell: bash
        env:
          NKE_IMAGE: ${{ vars.NVCR_NKE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -z "${NKE_IMAGE}" ]]; then
            echo "::error::NVCR_NKE_IMAGE is not set in the nvcr environment"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          sed -i \
            -e "s#^    repository: controller\$#    repository: ${NKE_IMAGE}#" \
            -e 's|^    # tag: ""$|    tag: ""|' \
            chart/values.yaml
          grep -Fqx "    repository: ${NKE_IMAGE}" chart/values.yaml \
            || { echo "::error::chart image rewrite did not apply"; exit 1; }
          grep -Fqx '    tag: ""' chart/values.yaml \
            || { echo "::error::chart tag was not cleared"; exit 1; }

          helm lint chart
          helm package chart \
            --version "${version}" \
            --app-version "${GITHUB_REF_NAME}" \
            --destination dist/capi-provider-nico

          chart_pkg="dist/capi-provider-nico/capi-provider-nico-${version}.tgz"
          rendered="$(helm template "${chart_pkg}")"
          grep -Fq "image: \"${NKE_IMAGE}:${GITHUB_REF_NAME}\"" <<< "${rendered}" \
            || { echo "::error::packaged chart names the wrong controller image"; exit 1; }
          grep -Fq 'name: svc-nke-ngc-imagepull' <<< "${rendered}" \
            || { echo "::error::packaged chart omits the NKE pull secret"; exit 1; }

      # Re-running a release must not fail once the version is published.
      - name: Push chart to NKE NVCR
        shell: bash
        env:
          NVCR_NKE_AUTH_TOKEN: ${{ secrets.NVCR_NKE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # $oauthtoken is NGC's literal username, not a variable reference.
          # shellcheck disable=SC2016
          echo "${NVCR_NKE_AUTH_TOKEN}" \
            | helm registry login nvcr.io -u '$oauthtoken' --password-stdin

          chart_pkg="dist/capi-provider-nico/capi-provider-nico-${GITHUB_REF_NAME#v}.tgz"
          if ! out="$(helm push "${chart_pkg}" "oci://nvcr.io/j7sbcjl3qgta" 2>&1)"; then
            printf '%s\n' "${out}"
            printf '%s\n' "${out}" | grep -qi "already exists"
          else
            printf '%s\n' "${out}"
          fi

  # The GHCR half. Until this existed the chart was published to NGC alone, so
  # the only copy of it needed an NGC login to fetch and named an image that
  # also needed one -- nothing about this provider was installable from outside
  # NVIDIA. This job needs neither the nvcr environment nor promote-nvcr; it
  # takes the already-promoted GHCR image from promote-ghcr.
  chart-ghcr:
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    name: Chart (GHCR)
    runs-on: linux-amd64-cpu16
    needs: [promote-ghcr]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push chart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.promote-ghcr.outputs.image }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" ]]; then
            echo "::error::promote-ghcr did not report an image"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          sed -i \
            -e "s#^    repository: controller\$#    repository: ${IMAGE}#" \
            -e 's|^    # tag: ""$|    tag: ""|' \
            chart/values.yaml
          grep -Fqx "    repository: ${IMAGE}" chart/values.yaml \
            || { echo "::error::chart image rewrite did not apply"; exit 1; }
          grep -Fqx '    tag: ""' chart/values.yaml \
            || { echo "::error::chart tag was not cleared"; exit 1; }

          helm lint chart
          helm package chart \
            --version "${version}" \
            --app-version "${GITHUB_REF_NAME}" \
            --destination .chart-dist

          chart_pkg=".chart-dist/capi-provider-nico-${version}.tgz"
          rendered="$(helm template "${chart_pkg}")"
          grep -Fq "image: \"${IMAGE}:${GITHUB_REF_NAME}\"" <<< "${rendered}" \
            || { echo "::error::packaged chart names the wrong controller image"; exit 1; }
          if grep -Fq 'image: "nvcr.io' <<< "${rendered}"; then
            echo "::error::rendered chart still references an NVCR controller image"
            exit 1
          fi

          echo "${GH_TOKEN}" \
            | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          # <repo>/charts/, so the chart never lands in the same OCI repository
          # as the controller image.
          helm push "${chart_pkg}" \
            "oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts"

  # Last, so the release never advertises an artifact that is not there yet: the
  # attached infrastructure-components.yaml references the GHCR tag by name.
  #
  # chart-ghcr is in `needs` because it publishes to the same public registry
  # this release points people at; with only promote-ghcr here it ran alongside
  # this job, so a release could appear while its chart push was still running
  # or had already failed.
  #
  # chart-ngc is deliberately NOT here. It pushes to an internal registry that
  # no consumer of this release can reach, and gating on it would let an NGC
  # outage -- an expired token, a 503 from the NGC CLI download -- skip the
  # public GitHub Release and with it the clusterctl assets, for people who
  # never touch NGC.
  release:
    name: Create GitHub Release
    runs-on: linux-amd64-cpu16
    needs: [promote-ghcr, chart-ghcr, sbom]
    timeout-minutes: 15
    permissions:
      contents: write
      security-events: write  # the malware scan uploads SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # clusterctl resolves a provider repository from the release assets, so
      # metadata.yaml and infrastructure-components.yaml have to be attached to
      # the release itself, not just generated.
      - name: Generate clusterctl provider artifacts
        env:
          IMAGE: ${{ needs.promote-ghcr.outputs.image }}
        run: |
          set -euo pipefail
          make kustomize
          KUSTOMIZE="$(pwd)/bin/kustomize" \
          CONTROLLER_IMG="${IMAGE}:${GITHUB_REF_NAME}" \
            make release-manifests

      # The sbom job stays independent and keeps upload-release-assets: false --
      # it runs alongside this job, not after it, so sbom-action could not find
      # a release to attach to yet. Pulling the artifacts here instead lets them
      # ride the same attach-before-publish path as the other release files.
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cluster-api-provider-nico-sbom-linux-*
          path: out
          merge-multiple: true

      # Scans what is about to be attached, before the release exists. Scanning
      # after the upload would mean withdrawing a release rather than never
      # cutting one -- and this repository cannot withdraw assets from a
      # published release at all.
      - name: Malware scan the release artifacts
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'out'
          category: 'clamav-release'
          output_file: 'clamav-release.sarif'

      # Keep every prerelease and the final release cumulative from the
      # preceding stable version. In particular, promoting an RC on the same
      # commit must not make GitHub compare the final tag with that RC tag.
      - name: Select release notes base
        id: release-notes-base
        run: |
          set -euo pipefail
          previous_tag=""
          while IFS= read -r tag; do
            if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag="${tag}"
              break
            fi
          done < <(git tag --merged HEAD^ --sort=-v:refname)
          if [[ -z "${previous_tag}" ]]; then
            echo "::error::No preceding stable release tag found"
            exit 1
          fi
          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"
          echo "Generating release notes from ${previous_tag} to ${GITHUB_REF_NAME}"

      # GitHub generates the release notes from merged pull requests. The
      # explicit body is prepended to those notes, keeping the promoted image
      # references visible without maintaining a per-version changelog file.
      - name: Prepare release body
        id: release-body
        env:
          IMAGE: ${{ needs.promote-ghcr.outputs.image }}
          DIGEST: ${{ needs.promote-ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo 'body<<EOF'
            echo "### Image"
            echo
            echo '```'
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The release is created as a draft so the assets upload before it is
      # published. If a repository has release immutability turned on, GitHub
      # seals the release when it is published and rejects any asset uploaded
      # after that.
      #
      # draft: true tells the action to leave the release unpublished, for a
      # full release as well as a prerelease. The action would otherwise
      # publish it itself, so the step below is what publishes it now. Do not
      # remove either one without the other.
      #
      # fail_on_unmatched_files makes this step fail if an artifact is missing,
      # before the release is created.
      # A consumer applies the components file straight into a cluster, so it
      # ships with a checksum to verify the download against. Names are relative
      # because `sha256sum -c` resolves them against the working directory, and
      # a consumer runs it from wherever they downloaded the assets.
      #
      # This runs before the release is created, so a failure here means no
      # release rather than a release missing an asset it can never receive:
      # publishing seals it.
      - name: Checksum the release assets
        run: |
          set -euo pipefail
          ( cd out && sha256sum -- *.yaml *.spdx.json > checksums.txt )
          echo "checksums.txt:"
          sed 's/^/    /' out/checksums.txt

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release-body.outputs.body }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          previous_tag: ${{ steps.release-notes-base.outputs.previous_tag }}
          fail_on_unmatched_files: true
          files: |
            out/metadata.yaml
            out/infrastructure-components.yaml
            out/checksums.txt
            out/cluster-api-provider-nico-sbom-linux-amd64.spdx.json
            out/cluster-api-provider-nico-sbom-linux-arm64.spdx.json

      # The assets are checked before the release is published, because
      # publishing it is what seals it.
      #
      # This step uses github-script rather than the gh command line tool,
      # because the job runs on a self-hosted runner where gh may not be
      # installed.
      - name: Publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          # Retries cover a server error or a dropped connection. The action
          # this step replaced retried three times, so without them a flake
          # would leave the release unpublished.
          retries: 3
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const expected = ['infrastructure-components.yaml', 'metadata.yaml', 'checksums.txt', 'cluster-api-provider-nico-sbom-linux-amd64.spdx.json', 'cluster-api-provider-nico-sbom-linux-arm64.spdx.json'].sort();

            // The asset list can lag behind an upload that has already
            // succeeded, so a short list is read again before it is treated as
            // a failure. Retries above do not cover this, because a stale list
            // is a successful response.
            let got = [];
            for (let attempt = 0; attempt < 3; attempt++) {
              if (attempt > 0) {
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
              const { data: rel } = await github.rest.repos.getRelease({
                ...context.repo, release_id,
              });
              // An asset counts only once it is fully uploaded, because
              // publishing seals it and a truncated file would be sealed too.
              got = rel.assets
                .filter(a => a.state === 'uploaded' && a.size > 0)
                .map(a => a.name)
                .sort();
              if (got.join(',') === expected.join(',')) {
                break;
              }
            }

            if (got.join(',') !== expected.join(',')) {
              core.setFailed(
                `Release ${release_id} carries [${got.join(', ') || 'nothing'}], ` +
                `and it should carry [${expected.join(', ')}]. It is left as an ` +
                `unpublished draft. Re-run this job to try again. Deleting the ` +
                `draft is not enough on its own, because the tag already exists ` +
                `and pushing it again starts nothing.`);
              return;
            }

            await github.rest.repos.updateRelease({
              ...context.repo, release_id, draft: false,
            });
            core.info(`Published ${context.ref.replace('refs/tags/', '')} with ${got.length} assets.`);
