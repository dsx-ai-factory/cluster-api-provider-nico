# Regenerates THIRD_PARTY_NOTICES.md and fails if it differs from the committed
# copy, so a dependency change cannot land without refreshed attribution.
#
# Deliberately not filtered on changed paths. The inventory is the import
# closure of the released commands, so it moves when an ordinary .go file
# changes its imports, not only when go.mod moves. A path filter would pass
# green while the committed file went stale, and the failure would then surface
# on main rather than on the pull request that caused it.

name: Third-Party Notices

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches
      # neither of the two above, so none of this CI ran on a dependency
      # bump. The bump merged on the strength of Dependabot's own testing.
      - "dependabot/**"
  workflow_dispatch:

permissions: {}

concurrency:
  # Per-commit on main, so every commit keeps its own runs. GitHub allows one
  # running and one pending run per group and cancels the PENDING one when a
  # third arrives -- whatever cancel-in-progress says, because that setting only
  # protects a run that has already started. Without the sha, a burst of merges
  # silently loses CI results for the commits in the middle.
  #
  # A literal name, not ${{ github.workflow }}: inside a workflow called by
  # merge-gate.yml that expression is the CALLER's name, so siblings collide.
  #
  # Pull-request branches keep sharing a group and still cancel, which is what
  # you want there.
  group: Third-Party Notices-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  notices-check:
    name: Check THIRD_PARTY_NOTICES.md is up to date
    runs-on: linux-amd64-cpu4
    if: github.repository == 'dsx-ai-factory/cluster-api-provider-nico'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify THIRD_PARTY_NOTICES.md is up to date
        run: make notices-check
