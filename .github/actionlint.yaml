#
# actionlint fails on any runs-on label it does not know. Without this file it
# reports every workflow that uses a self-hosted runner as broken, which is
# nearly all of them, and that makes it useless locally as well as in CI.

self-hosted-runner:
  labels:
    - linux-amd64-cpu4
    - linux-amd64-cpu8
    - linux-amd64-cpu16
    - linux-arm64-cpu16
